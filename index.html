<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Nora · insign AI — Interactive Showcase Avatar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 720px;
    background: radial-gradient(circle at 72% 18%, #1A4470 0%, #081C33 62%, #051120 100%);
    font-family: "Poppins", sans-serif;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .glow-ring {
    position: absolute;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    border: 1.5px solid rgba(215, 203, 75, 0.18);
    box-shadow: 0 0 110px rgba(0, 124, 218, 0.24), inset 0 0 70px rgba(215, 203, 75, 0.08);
    animation: breatheRing 6s ease-in-out infinite;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -54%);
  }

  .glow-ring-2 {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    border: 1px dashed rgba(0, 124, 218, 0.28);
    animation: rotateSlow 48s linear infinite;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -54%);
  }

  @keyframes breatheRing {
    0%, 100% { transform: translate(-50%, -54%) scale(1); opacity: 0.85; }
    50% { transform: translate(-50%, -54%) scale(1.035); opacity: 1; }
  }

  @keyframes rotateSlow {
    0% { transform: translate(-50%, -54%) rotate(0deg); }
    100% { transform: translate(-50%, -54%) rotate(360deg); }
  }

  .top-brand {
    position: absolute;
    top: 38px;
    right: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.96);
    padding: 10px 18px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 5;
  }
  .top-brand img {
    height: 32px;
    width: auto;
    display: block;
  }

  .card {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: -12px;
  }

  .avatar-wrap {
    position: relative;
    width: 236px;
    height: 236px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-pulse-halo {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(215, 203, 75, 0.42);
    animation: haloPulse 3.6s ease-in-out infinite;
  }

  body.speaking .avatar-pulse-halo {
    border-color: rgba(215, 203, 75, 0.92);
    box-shadow: 0 0 42px rgba(215, 203, 75, 0.65);
    animation: haloSpeak 0.9s ease-in-out infinite;
  }

  @keyframes haloPulse {
    0%, 100% { transform: scale(1); opacity: 0.45; }
    50% { transform: scale(1.055); opacity: 0.9; }
  }

  @keyframes haloSpeak {
    0%, 100% { transform: scale(1.01); opacity: 0.75; }
    50% { transform: scale(1.09); opacity: 1; }
  }

  .avatar-circle {
    width: 236px;
    height: 236px;
    border-radius: 50%;
    background: #081C33;
    border: 3.5px solid #D7CB4B;
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55), 0 0 32px rgba(0, 124, 218, 0.28);
    overflow: hidden;
    position: relative;
  }

  .avatar-circle video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    display: block;
  }

  .wave-pill {
    position: absolute;
    bottom: -14px;
    background: linear-gradient(135deg, #0D2847 0%, #081C33 100%);
    border: 1.5px solid rgba(215, 203, 75, 0.65);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    border-radius: 999px;
    padding: 7px 18px;
    display: flex;
    align-items: center;
    gap: 5px;
    height: 34px;
  }

  .bar {
    width: 4px;
    border-radius: 3px;
    background: #D7CB4B;
    animation: listenWave 2.2s ease-in-out infinite;
  }
  .bar.b1 { height: 8px; animation-delay: 0.0s; opacity: 0.75; }
  .bar.b2 { height: 14px; animation-delay: 0.25s; opacity: 0.9; }
  .bar.b3 { height: 18px; animation-delay: 0.5s; background: #FFFFFF; }
  .bar.b4 { height: 12px; animation-delay: 0.75s; opacity: 0.9; }
  .bar.b5 { height: 16px; animation-delay: 1.0s; }
  .bar.b6 { height: 9px; animation-delay: 1.25s; opacity: 0.75; }

  @keyframes listenWave {
    0%, 100% { transform: scaleY(0.65); }
    50% { transform: scaleY(1.18); }
  }

  body.speaking .bar {
    animation: speakWave 0.36s ease-in-out infinite alternate;
  }

  @keyframes speakWave {
    0% { transform: scaleY(0.4); }
    100% { transform: scaleY(1.55); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: rgba(215, 203, 75, 0.14);
    border: 1px solid rgba(215, 203, 75, 0.48);
    color: #D7CB4B;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 999px;
    margin-top: 8px;
    margin-bottom: 14px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #D7CB4B;
    box-shadow: 0 0 9px #D7CB4B;
    animation: dotBlink 2.4s ease-in-out infinite;
  }

  @keyframes dotBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  h1 {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.12;
    color: #FFFFFF;
    margin-bottom: 10px;
  }
  h1 span {
    font-weight: 400;
    color: #D7CB4B;
  }

  .yellow-bar {
    width: 84px;
    height: 4px;
    background: #D7CB4B;
    border-radius: 2px;
    margin: 4px 0 16px 0;
  }

  p.sub {
    font-family: "Inter", sans-serif;
    font-size: 20px;
    color: #E9EEF4;
    opacity: 0.9;
    letter-spacing: 0.15px;
    max-width: 780px;
  }

  .footer-brand {
    position: absolute;
    bottom: 30px;
    font-family: "Inter", sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: rgba(233, 238, 244, 0.58);
    letter-spacing: 0.8px;
  }
</style>
</head>

    const GREETING_URL = "https://v3b.fal.media/files/b/0ab2d874/9V84ZOza0v4R8WGGlEpED_output.mp4";
    const videoEl = document.getElementById("nora-video");
    const badgeEl = document.getElementById("badge-text");
    const statusEl = document.getElementById("status-text");

    function startIdle() {
      document.body.classList.remove("speaking");
      badgeEl.textContent = "AI Meeting Assistant · Live";
      statusEl.textContent = "Hört aufmerksam zu & erstellt das Meeting-Protokoll";
      videoEl.loop = true;
      videoEl.muted = true;
      if (videoEl.src !== IDLE_URL) {
        videoEl.src = IDLE_URL;
      }
      videoEl.play().catch(() => {});
    }

    function playSpeakingVideo(url, subtitleText) {
      document.body.classList.add("speaking");
      badgeEl.textContent = "Nora spricht · Live AI";
      if (subtitleText) {
        statusEl.textContent = subtitleText;
      }
      videoEl.loop = false;
      videoEl.muted = false;
      videoEl.src = url;
      videoEl.onended = () => {
        startIdle();
      };
      videoEl.play().catch(() => {
        // Fallback if unmuted autoplay requires gesture
        startIdle();
      });
    }

    const params = new URLSearchParams(window.location.search);
    const playParam = params.get("play");
    const videoParam = params.get("video");
    const subParam = params.get("sub");

    if (playParam === "greeting") {
      setTimeout(() => {
        playSpeakingVideo(GREETING_URL, subParam || "«Grüezi mitenand! Ich bin Nora, die intelligente Meeting-Assistentin von insign.»");
      }, 1200);
    } else if (videoParam) {
      setTimeout(() => {
        playSpeakingVideo(videoParam, subParam || "Nora spricht im Meeting …");
      }, 800);
    } else {
      startIdle();
    }
  </script>
</body>
</html>
