<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Nora · insign AI — Standard Note Taker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 720px;
    background: radial-gradient(circle at 72% 18%, #15385E 0%, #081C33 62%, #051120 100%);
    font-family: "Poppins", sans-serif;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .glow-ring {
    position: absolute;
    width: 540px;
    height: 540px;
    border-radius: 50%;
    border: 1.5px solid rgba(77, 171, 247, 0.25);
    box-shadow: 0 0 90px rgba(0, 124, 218, 0.22), inset 0 0 60px rgba(77, 171, 247, 0.08);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -54%);
    animation: breatheOuterRing 5.5s ease-in-out infinite;
  }

  @keyframes breatheOuterRing {
    0%, 100% { transform: translate(-50%, -54%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -54%) scale(1.035); opacity: 1; }
  }

  /* Top-left Mode Indicator: STANDARD MODE (Blue/Slate) */
  .mode-pill {
    position: absolute;
    top: 38px;
    left: 48px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 124, 218, 0.18);
    border: 1.5px solid rgba(77, 171, 247, 0.55);
    color: #A5D8FF;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    z-index: 5;
  }
  .mode-pill .mode-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4DABF7;
    box-shadow: 0 0 8px #4DABF7;
  }

  /* Top-right insign brand mark */
  .top-brand {
    position: absolute;
    top: 38px;
    right: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.96);
    padding: 10px 18px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 5;
  }
  .top-brand img {
    height: 32px;
    width: auto;
    display: block;
  }

  .card {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: -10px;
  }

  .avatar-wrap {
    position: relative;
    width: 224px;
    height: 224px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-halo {
    position: absolute;
    inset: -11px;
    border-radius: 50%;
    border: 2px solid rgba(77, 171, 247, 0.55);
    box-shadow: 0 0 26px rgba(77, 171, 247, 0.35);
    animation: pulseBlueHalo 3.4s ease-in-out infinite;
  }

  @keyframes pulseBlueHalo {
    0%, 100% { transform: scale(1); opacity: 0.45; box-shadow: 0 0 18px rgba(77, 171, 247, 0.25); }
    50% { transform: scale(1.065); opacity: 0.95; box-shadow: 0 0 38px rgba(77, 171, 247, 0.65); }
  }

  .avatar-circle {
    width: 224px;
    height: 224px;
    border-radius: 50%;
    background: #081C33;
    border: 3.5px solid #4DABF7;
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55), 0 0 32px rgba(0, 124, 218, 0.38);
    overflow: hidden;
    position: relative;
    animation: pulseBlueBorder 3.4s ease-in-out infinite;
  }

  @keyframes pulseBlueBorder {
    0%, 100% { border-color: #3B9AE8; box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 124, 218, 0.30); }
    50% { border-color: #82C9FF; box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55), 0 0 46px rgba(77, 171, 247, 0.68); }
  }

  .avatar-circle img,
  .avatar-circle video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    position: absolute;
    top: 0;
    left: 0;
  }

  .note-pill {
    position: absolute;
    bottom: -14px;
    background: linear-gradient(135deg, #0D2847 0%, #081C33 100%);
    border: 1.5px solid rgba(77, 171, 247, 0.65);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    border-radius: 999px;
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: #A5D8FF;
    letter-spacing: 0.5px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: rgba(0, 124, 218, 0.16);
    border: 1px solid rgba(77, 171, 247, 0.48);
    color: #74C0FC;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 999px;
    margin-top: 8px;
    margin-bottom: 14px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4DABF7;
    box-shadow: 0 0 8px #4DABF7;
  }

  h1 {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.12;
    color: #FFFFFF;
    margin-bottom: 10px;
  }
  h1 span.brand-sub {
    font-weight: 400;
    color: #74C0FC;
  }
  h1 span.brand-ai {
    font-weight: 600;
    color: #D7CB4B;
  }

  .blue-bar {
    width: 84px;
    height: 4px;
    background: #007CDA;
    border-radius: 2px;
    margin: 4px 0 16px 0;
  }

  p.sub {
    font-family: "Inter", sans-serif;
    font-size: 19px;
    color: #D0D9E4;
    opacity: 0.9;
    letter-spacing: 0.15px;
    max-width: 760px;
  }

  .footer-brand {
    position: absolute;
    bottom: 30px;
    font-family: "Inter", sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: rgba(233, 238, 244, 0.58);
    letter-spacing: 0.8px;
  }
</style>
</head>
